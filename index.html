<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome | Thananchanok Portfolio</title>

<style>

/* =========================================================
   GOOGLE FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Italiana&family=Kanit:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap');


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#fff7fa;
    color:#4a2835;
    font-family:"Kanit", sans-serif;
}


/* =========================================================
   MAIN
========================================================= */

.welcome-page{

    position:relative;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            #ffffff 0%,
            #fff8fb 38%,
            #ffeef5 72%,
            #ffdce9 100%
        );
}


/* =========================================================
   BACKGROUND LIGHT
========================================================= */

.light{

    position:absolute;

    width:600px;
    height:600px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(255,190,214,.35) 35%,
            rgba(255,190,214,0) 70%
        );

    filter:blur(10px);

    animation:
        lightMove 8s ease-in-out infinite alternate;

    pointer-events:none;
}

.light.one{
    top:-250px;
    left:-200px;
}

.light.two{
    bottom:-280px;
    right:-180px;

    animation-delay:2s;
}

@keyframes lightMove{

    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(40px,25px) scale(1.12);
    }

}


/* =========================================================
   DECORATIVE CIRCLES
========================================================= */

.circle{

    position:absolute;

    border-radius:50%;

    border:1px solid rgba(221,104,143,.15);

    pointer-events:none;

    animation:rotateCircle 20s linear infinite;
}

.circle.one{
    width:500px;
    height:500px;
}

.circle.two{
    width:700px;
    height:700px;

    animation-direction:reverse;
}

@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   FLOWER PETALS
========================================================= */

.petals{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.petal{

    position:absolute;

    top:-80px;

    width:18px;
    height:25px;

    background:
        linear-gradient(
            135deg,
            #fff 0%,
            #ffd0df 45%,
            #f29bb9 100%
        );

    border-radius:
        80% 20% 80% 20%;

    opacity:.75;

    filter:blur(.2px);

    box-shadow:
        0 3px 12px rgba(225,110,150,.18);

    animation:
        falling linear infinite;

}

.petal:nth-child(1){
    left:5%;
    animation-duration:9s;
    animation-delay:0s;
    transform:scale(.7);
}

.petal:nth-child(2){
    left:15%;
    animation-duration:12s;
    animation-delay:2s;
    transform:scale(1);
}

.petal:nth-child(3){
    left:25%;
    animation-duration:8s;
    animation-delay:4s;
    transform:scale(.6);
}

.petal:nth-child(4){
    left:38%;
    animation-duration:11s;
    animation-delay:1s;
    transform:scale(.8);
}

.petal:nth-child(5){
    left:52%;
    animation-duration:13s;
    animation-delay:3s;
    transform:scale(.7);
}

.petal:nth-child(6){
    left:65%;
    animation-duration:9s;
    animation-delay:5s;
    transform:scale(1.1);
}

.petal:nth-child(7){
    left:76%;
    animation-duration:12s;
    animation-delay:1s;
    transform:scale(.65);
}

.petal:nth-child(8){
    left:88%;
    animation-duration:10s;
    animation-delay:3s;
    transform:scale(.9);
}

@keyframes falling{

    0%{
        transform:
            translateY(-100px)
            translateX(0)
            rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:.8;
    }

    50%{
        transform:
            translateY(50vh)
            translateX(80px)
            rotate(180deg);
    }

    100%{
        transform:
            translateY(110vh)
            translateX(-80px)
            rotate(360deg);
        opacity:0;
    }

}


/* =========================================================
   CONTENT
========================================================= */

.content{

    position:relative;

    z-index:10;

    text-align:center;

    padding:40px;

    max-width:900px;

    animation:
        contentIn 1.8s cubic-bezier(.16,1,.3,1);

}

@keyframes contentIn{

    from{
        opacity:0;
        transform:
            translateY(35px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   SMALL LABEL
========================================================= */

.small-label{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    margin-bottom:22px;

    padding:9px 22px;

    border:1px solid rgba(206,90,128,.22);

    border-radius:100px;

    background:rgba(255,255,255,.55);

    backdrop-filter:blur(12px);

    color:#b84e73;

    font-size:13px;

    letter-spacing:3px;

    text-transform:uppercase;

    box-shadow:
        0 8px 30px rgba(198,83,123,.08);

}

.small-label::before{

    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#dc7397;

    box-shadow:
        0 0 12px rgba(220,115,151,.7);

    animation:pulse 1.8s infinite;

}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.5);
        opacity:1;
    }

}


/* =========================================================
   MAIN TITLE
========================================================= */

.title{

    font-family:"Playfair Display", serif;

    font-size:
        clamp(48px, 8vw, 100px);

    font-weight:500;

    line-height:1.05;

    letter-spacing:-2px;

    color:#542f3e;

    margin-bottom:18px;

}

.title span{

    display:block;

    background:
        linear-gradient(
            90deg,
            #9d3f63,
            #e27b9f,
            #a9476d,
            #e68baa
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientMove 5s ease infinite;

}

@keyframes gradientMove{

    0%{
        background-position:0% center;
    }

    50%{
        background-position:100% center;
    }

    100%{
        background-position:0% center;
    }

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    font-family:"Italiana", serif;

    font-size:
        clamp(16px, 2vw, 23px);

    letter-spacing:5px;

    color:#9d6679;

    margin-bottom:25px;

    text-transform:uppercase;

}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{

    font-size:15px;

    font-weight:300;

    color:#805967;

    line-height:1.9;

    max-width:600px;

    margin:0 auto 35px;

}


/* =========================================================
   LOADING
========================================================= */

.loading-box{

    width:min(420px, 80vw);

    margin:0 auto;

}

.loading-text{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;

    font-size:12px;

    letter-spacing:2px;

    color:#a56a7d;

}

.progress{

    position:relative;

    width:100%;
    height:4px;

    overflow:hidden;

    border-radius:100px;

    background:rgba(199,100,132,.13);

}

.progress-bar{

    width:0%;

    height:100%;

    border-radius:100px;

    background:
        linear-gradient(
            90deg,
            #c9557e,
            #f1a2bb,
            #c9557e
        );

    box-shadow:
        0 0 15px rgba(211,89,132,.35);

    transition:
        width .15s linear;

}


/* =========================================================
   ENTER BUTTON
========================================================= */

.enter-btn{

    position:relative;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    margin-top:30px;

    padding:14px 32px;

    border:1px solid rgba(188,71,111,.3);

    border-radius:100px;

    color:#9d3f63;

    text-decoration:none;

    font-size:14px;

    letter-spacing:2px;

    background:
        rgba(255,255,255,.6);

    backdrop-filter:blur(12px);

    box-shadow:
        0 10px 35px rgba(183,69,111,.1);

    overflow:hidden;

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease;

    opacity:0;
    pointer-events:none;

}

.enter-btn.show{

    opacity:1;
    pointer-events:auto;

    animation:
        buttonIn .8s cubic-bezier(.16,1,.3,1);

}

@keyframes buttonIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.enter-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.7),
            transparent
        );

    transition:left .7s ease;

}

.enter-btn:hover::before{
    left:100%;
}

.enter-btn:hover{

    transform:translateY(-4px);

    background:#fff;

    box-shadow:
        0 15px 40px rgba(183,69,111,.2);

}


/* =========================================================
   FLOWER DECORATION
========================================================= */

.flower{

    position:absolute;

    width:160px;
    height:160px;

    opacity:.55;

    animation:
        flowerFloat 6s ease-in-out infinite;

}

.flower.left{
    left:-25px;
    bottom:30px;
}

.flower.right{
    right:-25px;
    top:30px;

    animation-delay:2s;
}

.flower-center{

    position:absolute;

    top:50%;
    left:50%;

    width:35px;
    height:35px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #f4c16d,
            #d99050
        );

    box-shadow:
        0 0 20px rgba(220,145,80,.2);

}

.flower-petal{

    position:absolute;

    top:50%;
    left:50%;

    width:45px;
    height:70px;

    border-radius:
        60% 40% 60% 40%;

    background:
        linear-gradient(
            145deg,
            #fff,
            #f7bfd1
        );

    transform-origin:
        center bottom;

}

.flower-petal:nth-child(1){
    transform:
        translate(-50%,-100%)
        rotate(0deg);
}

.flower-petal:nth-child(2){
    transform:
        translate(-50%,-100%)
        rotate(60deg);
}

.flower-petal:nth-child(3){
    transform:
        translate(-50%,-100%)
        rotate(120deg);
}

.flower-petal:nth-child(4){
    transform:
        translate(-50%,-100%)
        rotate(180deg);
}

.flower-petal:nth-child(5){
    transform:
        translate(-50%,-100%)
        rotate(240deg);
}

.flower-petal:nth-child(6){
    transform:
        translate(-50%,-100%)
        rotate(300deg);
}

@keyframes flowerFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(-3deg);
    }

    50%{
        transform:
            translateY(-15px)
            rotate(3deg);
    }

}


/* =========================================================
   CORNER TEXT
========================================================= */

.corner{

    position:absolute;

    z-index:10;

    font-family:"Italiana", serif;

    font-size:12px;

    letter-spacing:3px;

    color:#b27889;

    opacity:.8;

}

.corner.top-left{
    top:30px;
    left:35px;
}

.corner.bottom-right{
    right:35px;
    bottom:30px;
}


/* =========================================================
   SCREEN TRANSITION
========================================================= */

.transition{

    position:fixed;

    inset:0;

    z-index:999;

    background:#fff;

    transform:
        translateY(100%);

    transition:
        transform 1s cubic-bezier(.76,0,.24,1);

}

.transition.active{

    transform:
        translateY(0);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .content{
        padding:25px;
    }

    .title{
        font-size:48px;
        letter-spacing:-1px;
    }

    .subtitle{
        font-size:14px;
        letter-spacing:3px;
    }

    .description{
        font-size:14px;
    }

    .flower{
        transform:scale(.7);
    }

    .corner{
        font-size:9px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;

    }

}

</style>
</head>


<body>


<!-- =======================================================
     WELCOME PAGE
======================================================= -->

<main class="welcome-page">


    <!-- Background -->

    <div class="light one"></div>
    <div class="light two"></div>

    <div class="circle one"></div>
    <div class="circle two"></div>


    <!-- Falling Petals -->

    <div class="petals">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

    </div>


    <!-- Decorative Flower Left -->

    <div class="flower left">

        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>

        <div class="flower-center"></div>

    </div>


    <!-- Decorative Flower Right -->

    <div class="flower right">

        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>
        <div class="flower-petal"></div>

        <div class="flower-center"></div>

    </div>


    <!-- Corner -->

    <div class="corner top-left">
        THANANCHANOK
    </div>

    <div class="corner bottom-right">
        PORTFOLIO • 2026
    </div>


    <!-- Main Content -->

    <section class="content">


        <div class="small-label">
            Personal Portfolio
        </div>


        <h1 class="title">

            Welcome

            <span>
                to My Portfolio
            </span>

        </h1>


        <div class="subtitle">
            Website
        </div>


        <p class="description">

            ยินดีต้อนรับเข้าสู่เว็บไซต์แฟ้มสะสมผลงานของฉัน
            <br>

            <strong>
                Thananchanok
            </strong>

            <br>

            Explore my profile, journey, activities
            and creative works.

        </p>


        <!-- Loading -->

        <div class="loading-box">

            <div class="loading-text">

                <span id="loadingText">
                    Preparing your experience...
                </span>

                <span id="percent">
                    0%
                </span>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>

        </div>


        <!-- Enter -->

        <a
            href="portfolio.html"
            class="enter-btn"
            id="enterBtn">

            <span>
                Enter Portfolio
            </span>

            <span>
                →
            </span>

        </a>


    </section>


</main>


<!-- =======================================================
     TRANSITION
======================================================= -->

<div
    class="transition"
    id="transition">
</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

/*
    ระยะเวลาโหลด
    5000 = 5 วินาที
*/

const LOADING_TIME = 5000;


/* =========================================================
   ELEMENTS
========================================================= */

const progressBar =
    document.getElementById("progressBar");

const percent =
    document.getElementById("percent");

const loadingText =
    document.getElementById("loadingText");

const enterBtn =
    document.getElementById("enterBtn");

const transition =
    document.getElementById("transition");


/* =========================================================
   LOADING TEXT
========================================================= */

const messages = [

    "Preparing your experience...",

    "Opening my portfolio...",

    "Creating something beautiful...",

    "Almost ready..."

];


/* =========================================================
   LOADING SYSTEM
========================================================= */

let progress = 0;

const intervalTime = 50;

const increment =
    100 /
    (LOADING_TIME / intervalTime);


const loadingInterval =
    setInterval(() => {

        progress += increment;


        if(progress >= 100){

            progress = 100;

            clearInterval(
                loadingInterval
            );

            finishLoading();

        }


        progressBar.style.width =
            progress + "%";


        percent.textContent =
            Math.floor(progress) + "%";


        updateMessage(progress);


    }, intervalTime);


/* =========================================================
   UPDATE MESSAGE
========================================================= */

function updateMessage(value){

    if(value < 30){

        loadingText.textContent =
            messages[0];

    }

    else if(value < 60){

        loadingText.textContent =
            messages[1];

    }

    else if(value < 90){

        loadingText.textContent =
            messages[2];

    }

    else{

        loadingText.textContent =
            messages[3];

    }

}


/* =========================================================
   FINISH
========================================================= */

function finishLoading(){

    loadingText.textContent =
        "Welcome to my portfolio.";

    percent.textContent =
        "100%";


    enterBtn.classList.add("show");

}


/* =========================================================
   PAGE TRANSITION
========================================================= */

enterBtn.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        const target =
            this.href;


        transition.classList.add(
            "active"
        );


        setTimeout(
            () => {

                window.location.href =
                    target;

            },
            850
        );

    }
);


/* =========================================================
   AUTO ENTER
========================================================= */

/*

    ถ้าต้องการให้โหลดเสร็จแล้ว
    เข้า portfolio.html อัตโนมัติ

    ให้ลบเครื่องหมาย // ด้านหน้า
    window.location.href

*/

// setTimeout(() => {
//     transition.classList.add("active");
//
//     setTimeout(() => {
//         window.location.href = "portfolio.html";
//     }, 850);
//
// }, LOADING_TIME + 1200);


</script>

</body>
</html>
